<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Avrundet firkant (squircle-aktig), gjennomsiktig utenfor -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1B2A45"/>
      <stop offset="1" stop-color="#0F1A30"/>
    </linearGradient>
    <clipPath id="squircle">
      <path d="M 1024 512 C 1024 960, 960 1024, 512 1024 C 64 1024, 0 960, 0 512 C 0 64, 64 0, 512 0 C 960 0, 1024 64, 1024 512 Z"/>
    </clipPath>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <g clip-path="url(#squircle)">
    <!-- Bakgrunn -->
    <rect width="1024" height="1024" fill="url(#bg)"/>

    <!-- Svak indre ring for dybde -->
    <circle cx="512" cy="512" r="380" fill="none" stroke="#2B3E5E" stroke-width="3" opacity="0.5"/>

    <!-- Rød sirkelstreken som tegnes -->
    <circle cx="512" cy="512" r="290" fill="none" stroke="#FF3B30" stroke-width="34"
            stroke-linecap="round" stroke-dasharray="1650" stroke-dashoffset="470"
            transform="rotate(105 512 512)"/>

    <!-- Musepeker (pil) plassert der streken slutter -->
    <g transform="translate(528 800) rotate(-8)" filter="url(#softShadow)">
      <path d="M 0 0 L 0 150 L 34 120 L 57 172 L 84 161 L 61 110 L 106 104 Z"
            fill="#F2F5FA" stroke="#C9D3E4" stroke-width="4" stroke-linejoin="round"/>
    </g>
  </g>
</svg>